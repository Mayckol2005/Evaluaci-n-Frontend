name: build and push

on:
  push:
    branches: [ "feature/workflow" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: build and push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build an push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/FrontEnd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/FrontEnd:v${{ github.run_number }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WEB_SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/FrontEnd:latest
            docker stop frontend-cont || true
            docker rm frontend-cont || true
            docker run -d --name frontend-cont -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/FrontEnd:latest